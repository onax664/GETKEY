<!doctype html>
<html lang="vi" translate="no" class="notranslate">
<head>

<title>Get Key</title>

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6FBF8;--card:#FFFFFF;--ink:#12261C;--muted:#4B5F55;--accent:#0A6B41;--line:#BFEBD4;--soft:#EAF7F0}
@media (prefers-color-scheme: dark){:root{--bg:#0D1712;--card:#14231B;--ink:#EAF5EE;--muted:#A9BDB1;--accent:#3FCB8B;--line:#24523B;--soft:#1B3327}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;padding:24px 20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.head{display:flex;align-items:center;gap:16px}
.logo{width:56px;height:56px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--bg)}
.site{font-size:22px;font-weight:800;color:var(--accent)}
.sub{font-size:14px;font-weight:500;letter-spacing:1px;color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--accent)}
h1{margin:12px 0;display:flex;align-items:center;gap:12px;font-size:40px;font-weight:800;color:var(--accent)}
.info{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--muted)}
.card{width:100%;max-width:320px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.avt{width:88px;height:88px;border-radius:20px;border:2px dashed var(--line);background:var(--soft);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.avt img{width:100%;height:100%;object-fit:cover}
.game{font-size:22px;font-weight:800}
.once{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted)}
.btn{width:100%;height:52px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--bg);font:700 18px 'Be Vietnam Pro',system-ui,sans-serif;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.1)}
.keybox{width:100%;border-radius:14px;border:2px dashed var(--accent);background:var(--soft);padding:14px 10px;text-align:center;font-size:21px;font-weight:800;letter-spacing:1px;word-break:break-all;user-select:all}
.msg{font-size:15px;line-height:1.6;color:var(--muted);text-align:center;margin:0}
.msg.err{color:#B3261E}
@media (prefers-color-scheme: dark){.msg.err{color:#FF8A80}}
.modal{position:fixed;inset:0;background:rgba(5,10,8,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.panel{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:#1B2236;color:#FFFFFF;border:1px solid #29334C;border-radius:26px;padding:30px 28px;display:flex;flex-direction:column;gap:24px;box-shadow:0 18px 55px rgba(0,0,0,.35)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px}
.pt{font-size:clamp(24px,4.5vw,42px);font-weight:800;line-height:1.35;margin:0;letter-spacing:-.5px}
.px{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid #2A3350;background:#232C45;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sep{height:1px;background:#2A3350;margin:0 -28px}
.code{background:#090C18;color:#A9BDF0;border:1px solid #11172A;border-radius:22px;padding:24px;font:clamp(15px,2.8vw,24px)/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;user-select:all;min-height:120px}
.cp{align-self:flex-start;height:64px;padding:0 34px;border-radius:999px;border:0;background:linear-gradient(110deg,#6658ED 0%,#08B8D8 100%);color:#FFFFFF;font:800 clamp(18px,3vw,26px) 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:0 8px 22px rgba(25,130,220,.18)}
.cp:hover{filter:brightness(1.08)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:#232C45;border-radius:16px;padding:12px 14px}
.rn{flex:1;min-width:0}
.rname{font-weight:700;font-size:16px}
.rver{font-size:13px;color:#A9B4D0;margin-top:2px}
.rb{flex:none;height:44px;min-width:96px;padding:0 18px;border-radius:12px;border:0;font:800 15px 'Be Vietnam Pro',system-ui,sans-serif}
.rb.on{background:#3FCB8B;color:#08150E;cursor:pointer}
.rb.off{background:#2A3350;color:#FFC857;cursor:not-allowed}
.detail{display:flex;flex-direction:column;gap:16px}
@media(max-width:520px){.modal{padding:12px}.panel{padding:22px 18px;border-radius:22px;gap:20px}.sep{margin:0 -18px}.code{padding:18px;border-radius:18px}.cp{height:56px;padding:0 25px}}
[hidden]{display:none!important}
</style>
</head>

// ===== CHỈNH Ở ĐÂY =====
var CONFIG = {
  SITE_NAME: "Sever Key",
  GAME_NAME: "Roblox",
  AVATAR_URL: AVATAR_DATA,  // ảnh avatar (đã nhúng sẵn), có thể đổi thành link ảnh khác
  // Danh sách script. status: "on" = dùng được, "maintenance" = hiện chữ Bảo trì và không bấm được
  SCRIPTS: [
    {game:"Steal An Egg",   version:"Script V1", status:"on", code:'loadstring(game:HttpGet("[LINK SCRIPT STEAL AN EGG V1]"))()'},
    {game:"Steal An Egg",   version:"Script V2", status:"maintenance"},
    {game:"[TÊN GAME 2]",   version:"Script V1", status:"maintenance"},
    {game:"[TÊN GAME 3]",   version:"Script V1", status:"maintenance"}
  ],
  KEY_PREFIX: "TH_MOD_",
  // Thứ tự vượt: gtraffic -> gtraffic -> link4m
  STEPS: [
    "https://gtraffic.io/st?apikey=61fc310c63cf43f5a552d9c57e6052b6&url=",
    "https://gtraffic.io/st?apikey=61fc310c63cf43f5a552d9c57e6052b6&url=",
    "https://link4m.co/st?api=6a6060efd9be580bf777cce8&url="
  ],
  MIN_SECONDS: 8,          // mỗi bước vượt nhanh hơn số giây này sẽ bị coi là bỏ qua
  MIN_TOTAL_SECONDS: 120,  // tổng thời gian từ lúc bấm Vượt 1 lần đến khi xong; sớm hơn sẽ báo lỗi
  SESSION_MINUTES: 30,     // thời gian tối đa để vượt xong cả 3 bước
  DEMO: false              // true = chạy thử, không mở link vượt thật
};
// =========================

var STORE = "getkey_state_v2";
function $(id){return document.getElementById(id)}
function load(){try{return JSON.parse(localStorage.getItem(STORE)||"null")}catch(e){return null}}
function save(s){try{localStorage.setItem(STORE,JSON.stringify(s))}catch(e){}}
function clearState(){try{localStorage.removeItem(STORE)}catch(e){}}
function rnd(n){var a=new Uint32Array(n),s="";crypto.getRandomValues(a);for(var i=0;i<n;i++)s+=a[i]%10;return s}
function token(){var a=new Uint8Array(16),s="";crypto.getRandomValues(a);a.forEach(function(b){s+=("0"+b.toString(16)).slice(-2)});return s}
function showError(t){var e=$("err");e.textContent=t;e.hidden=false}
function base(){return location.origin+location.pathname}

function showWait(n){
  $("viewStart").hidden=true;$("viewWait").hidden=false;
  $("waitMsg").textContent="Đang chuyển sang nhiệm vụ "+n+"/"+CONFIG.STEPS.length+"...";
}

// Mở bước vượt thứ n; vượt xong sẽ quay về trang này kèm ?s=n&k=token
function go(n,s){
  s.step=n;s.t0=Date.now();save(s);
  showWait(n);
  var back=base()+"?s="+n+"&k="+s.token;
  if(CONFIG.DEMO){setTimeout(function(){location.href=back},CONFIG.MIN_SECONDS*1000+500);return}
  setTimeout(function(){location.href=CONFIG.STEPS[n-1]+encodeURIComponent(back)},800);
}

// Key chỉ hiện một lần: không lưu key ở đâu cả, tải lại trang là mất
function showKey(key){
  $("viewStart").hidden=true;$("viewWait").hidden=true;$("viewKey").hidden=false;
  $("keyText").textContent=key;
  $("expMsg").textContent="Key chỉ hiển thị một lần và dùng được một lần. Hãy sao chép ngay, tải lại trang là mất.";
}

function init(){
  $("site").textContent=CONFIG.SITE_NAME;
  $("game").textContent=CONFIG.GAME_NAME;
  var av=$("avt");
  if(CONFIG.AVATAR_URL){var im=new Image();im.src=CONFIG.AVATAR_URL;im.alt=CONFIG.GAME_NAME;av.appendChild(im)}
  else av.textContent="[AVT]";

  var q=new URLSearchParams(location.search);
  var n=parseInt(q.get("s")||"0",10),k=q.get("k");
  var s=load();

  if(n&&k){
    history.replaceState(null,"",location.pathname);
    if(!s||s.token!==k||s.step!==n||Date.now()-s.created>CONFIG.SESSION_MINUTES*60000){
      clearState();showError("Phiên vượt không hợp lệ. Hãy vượt lại từ đầu.");return}
    if((Date.now()-s.t0)/1000<CONFIG.MIN_SECONDS){
      clearState();showError("Bạn vượt quá nhanh nên không hợp lệ. Hãy vượt lại.");return}
    if(n<CONFIG.STEPS.length){go(n+1,s);return}
    if((Date.now()-s.created)/1000<CONFIG.MIN_TOTAL_SECONDS){
      clearState();showError("Lỗi: bạn vượt quá nhanh, phải mất ít nhất "+CONFIG.MIN_TOTAL_SECONDS+" giây. Hãy vượt lại.");return}
    save({done:true});
    showKey(CONFIG.KEY_PREFIX+rnd(8));
    return;
  }
  if(s&&s.done)showError("Key lần trước đã hiển thị và sẽ không hiện lại. Hãy vượt lại để lấy key mới.");
}

$("goBtn").onclick=function(){
  go(1,{token:token(),created:Date.now()});
};

$("copyBtn").onclick=function(){
  var k=$("keyText").textContent,b=$("copyBtn");
  function ok(){b.textContent="Đã sao chép";setTimeout(function(){b.textContent="Sao chép key"},1800)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(k).then(ok,function(){})}
  else{var r=document.createRange();r.selectNodeContents($("keyText"));var g=getSelection();g.removeAllRanges();g.addRange(r);try{document.execCommand("copy");ok()}catch(e){}}
};

var lastFocus;
function renderList(){
  var box=$("scList");box.textContent="";
  CONFIG.SCRIPTS.forEach(function(sc,i){
    var row=document.createElement("div");row.className="row";
    var left=document.createElement("div");left.className="rn";
    var a=document.createElement("div");a.className="rname";a.textContent=sc.game;
    var b=document.createElement("div");b.className="rver";b.textContent=sc.version;
    left.appendChild(a);left.appendChild(b);
    var btn=document.createElement("button");btn.type="button";
    if(sc.status==="on"){btn.className="rb on";btn.textContent="Lấy";btn.onclick=function(){showDetail(i)}}
    else{btn.className="rb off";btn.textContent="Bảo trì";btn.disabled=true}
    row.appendChild(left);row.appendChild(btn);box.appendChild(row);
  });
}
function showList(){
  $("scTitle").textContent="Chọn script";
  $("scDetail").hidden=true;$("scList").hidden=false;renderList();
}
function showDetail(i){
  var sc=CONFIG.SCRIPTS[i];
  $("scTitle").textContent=(sc.game+" - "+sc.version).toUpperCase();
  $("scCode").textContent=sc.code;
  $("scList").hidden=true;$("scDetail").hidden=false;
  $("scCopy").focus();
}
function openScript(){
  lastFocus=document.activeElement;
  $("modal").hidden=false;
  showDetail(0);
  $("scClose").focus();
}
function closeScript(){$("modal").hidden=true;window.scrollTo(0,0);if(lastFocus)lastFocus.focus()}
$("scriptBtn").onclick=openScript;
$("scClose").onclick=closeScript;
$("modal").onclick=function(e){if(e.target===this)closeScript()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("modal").hidden)closeScript()});
$("scCopy").onclick=function(){
  var t=$("scCode").textContent,l=$("scCopyLbl");
  function ok(){l.textContent="Đã copy";setTimeout(function(){l.textContent="Copy"},1800)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){})}
  else{var r=document.createRange();r.selectNodeContents($("scCode"));var g=getSelection();g.removeAllRanges();g.addRange(r);try{document.execCommand("copy");ok()}catch(e){}}
};

init();
</script>
